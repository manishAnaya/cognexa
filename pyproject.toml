[project]
name = "cognexa"
version = "0.1.0"
description = "An Enterprise AI Research Assistant powered by Advanced RAG and LangGraph"
readme = "README.md"
authors = [
    { name = "Manish Kumar Agrahari", email = "163833071+magrahari@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "chromadb>=1.5.9",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg[binary,pool]>=3.3.8",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "pypdf>=7.0.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.33",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.2.0",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.uv]
package = false
